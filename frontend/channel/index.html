<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Channel</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#08172E;
color:#fff;
padding:20px;
}

.card{
background:#132544;
border-radius:18px;
padding:20px;
margin-top:40px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,.3);
}

h2{
margin-bottom:10px;
}

p{
color:#b8c7e0;
margin-bottom:25px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}

.joinBtn{
background:#2D7CFF;
color:#fff;
}

.claimBtn{
background:linear-gradient(90deg,#1EB8FF,#2BE66B);
color:#fff;
}

.backBtn{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#18A0FB,#2D5BFF);
color:#fff;
font-size:18px;
font-weight:bold;
cursor:pointer;
box-shadow:0 4px 15px rgba(24,160,251,.4);
transition:0.3s;
}

.backBtn:hover{
transform:scale(1.02);
}

</style>
</head>

<body>

<div class="card">
<h2>📢 Join Telegram Channel</h2>

<p>Join our official Telegram channel and claim ৳10 bonus.</p>

<button class="joinBtn"
onclick="window.open('https://t.me/minicashpanda')">
JOIN CHANNEL
</button>

<button class="claimBtn" id="claimBtn">
CLAIM BONUS
</button>

<button class="backBtn" id="backBtn">
⬅ Back
</button>

</div>

<script>
document.getElementById("claimBtn").onclick = async function () {

    const telegramId = localStorage.getItem("telegramId");

    if (!telegramId) {
        alert("Telegram ID not found.");
        return;
    }

    try {

        // Verify Channel Join
        const verify = await fetch("/api/check-channel", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ telegramId })
        });

        const verifyData = await verify.json();

        if (!verifyData.joined) {
            alert("Please join our Telegram Channel first.");
            return;
        }

        // Claim Bonus
        const response = await fetch("/api/channel-bonus", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ telegramId })
        });

        const data = await response.json();

        alert(data.message);

        if (data.success) {
            window.location.href = "/history/index.html";
        }

    } catch (err) {
        alert("Server Error");
    }
};

document.getElementById("backBtn").onclick = function () {
    window.location.href = "/home/index.html";
};

</script>

</body>
</html>
